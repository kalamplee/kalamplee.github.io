excerpt: "เข้าเป็นหนึ่งในคนที่มีความอนุรักษ์นิยมสูงในกลุ่มพี่น้องเจอร์มานิก ต่างจากภาษาอังกฤษที่ชอบหยิบยืมคนอื่นเสมอ แต่เขาเลือกที่จะสร้างแนวคิดของตัวเองขึ้นมาอย่างมั่นคง แม้จะมีความหลากหลายสูงก็ยังมีพื้นที่โดดเด่นในสายงานที่ตัวเองถนัด"
