title: "หน้าตาของ \"ต้นฉบับ\" The Odyssey ในภาษากรีกโบราณ"
url: "https://www.patreon.com/MrKalamplee/posts/hnaataakh-ng-165452715"
excerpt: "หากพูดถึง \"ต้นฉบับ\" ของ The Odyssey จริง ๆ หลายคนคงไม่ได้นึกถึงแค่ฉบับภาษาอังกฤษของ Samuel Butler หรือ Richard Lattimore แต่เป็นฉบับร้อยกรองภาษากรีกโบราณของโฮเมอร์"
