title: "ภาษามือไทย"
url: "https://www.patreon.com/MrKalamplee/posts/phaasaamuue-170349844"
excerpt: "เด็กหญิงในช่วงวัยกำลังโต (มี native speakers ประมาณ 90,000 - 300,000 คน) เป็นลูกครึ่งระหว่างภาษามืออเมริกัน (ASL) กับภาษามือกรุงเทพเก่า กับภาษามือเชียงใหม่ ถือกำเนิดขึ้นในช่วงทศวรรษ 1950s ได้รับการยอมรับอย่างเป็นทางการในปี 1999 ให้เป็นภาษาประจำชาติของคนหูหนวกในประเทศไทย"
