excerpt: "คำชี้เฉพาะของภาษาเยอรมันจะมีความซับซ้อนกว่าภาษาอังกฤษที่มีแค่ The โดยของภาษาเยอรมันจะมี 3 คำ: Der, Die, Das โดยแยกใช้ตามเพศของคำนามและรูปพหูพจน์ เพราะภาษาเยอรมันยังแยกเพศคำนามอยู่ ต่างจากภาษาอังกฤษที่ไม่มีระบบเพศของคำนามแล้ว"
