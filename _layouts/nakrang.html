<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description"
        content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">

    <link rel="icon" type="image/png" href="{{ '/images/kalam-logo.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&family=Noto+Serif+JP:wght@100..900&display=swap"
        rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        [data-lucide] {
            stroke-width: 1px;
        }

        /* Font Configuration */
        body {
            font-family: 'Noto Serif', 'Noto Serif JP', serif !important;
        }

        html[data-lang="th"] body {
            font-family: 'K2D', sans-serif !important;
        }
    </style>

    {% seo %}
    {% feed_meta %}

    <!-- Language Translations Data -->
    <script>
        window.siteTranslations = {
            th: {{ site.data.i18n.th | jsonify }},
            en: {{ site.data.i18n.en | jsonify }},
            ja: {{ site.data.i18n.ja | jsonify }},
            la: {{ site.data.i18n.la | jsonify }},
            tok: {{ site.data.i18n.tok | jsonify }},
            grc: {{ site.data.i18n.grc | jsonify }}
        };
        window.siteLangConfig = {{ site.data.languages.languages | jsonify }};
        window.siteDefaultLang = '{{ site.data.languages.default | default: "th" }}';
    </script>
</head>

<body class="bg-primary-bg text-primary-text">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #presentation-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            text-align: center;
            padding: 40px;
            box-sizing: border-box;
        }

        .slide {
            display: none;
            font-size: 2rem;
            line-height: 1.6;
            max-width: 800px;
            animation: fadeIn 0.3s ease-in-out;
        }

        .slide.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .nav-zone {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 15%;
            z-index: 10;
            cursor: pointer;
        }

        #prev-zone {
            left: 0;
        }

        #next-zone {
            right: 0;
        }

        #page-indicator {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.9rem;
            color: var(--text-muted, #999);
            pointer-events: none;
        }
    </style>

    <div id="prev-zone" class="nav-zone"></div>
    <div id="next-zone" class="nav-zone"></div>

    <div id="presentation-container">
        <div id="slides-content">
            {{ content }}
        </div>
    </div>

    <div id="page-indicator"></div>

    <script>
        (function() {
            const contentDiv = document.getElementById('slides-content');
            const indicator = document.getElementById('page-indicator');
            
            const children = Array.from(contentDiv.children);
            contentDiv.innerHTML = '';

            let currentSlideDiv = document.createElement('div');
            currentSlideDiv.className = 'slide active';
            contentDiv.appendChild(currentSlideDiv);

            children.forEach(child => {
                if (child.tagName === 'HR') {
                    currentSlideDiv = document.createElement('div');
                    currentSlideDiv.className = 'slide';
                    contentDiv.appendChild(currentSlideDiv);
                } else {
                    currentSlideDiv.appendChild(child);
                }
            });

            const slides = document.querySelectorAll('.slide');
            let currentSlide = 0;

            function updateSlide() {
                slides.forEach((slide, index) => {
                    slide.classList.toggle('active', index === currentSlide);
                });
                indicator.innerText = `${currentSlide + 1} / ${slides.length}`;
            }

            document.getElementById('next-zone').addEventListener('click', () => {
                if (currentSlide < slides.length - 1) {
                    currentSlide++;
                    updateSlide();
                }
            });

            document.getElementById('prev-zone').addEventListener('click', () => {
                if (currentSlide > 0) {
                    currentSlide--;
                    updateSlide();
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight') {
                    document.getElementById('next-zone').click();
                } else if (e.key === 'ArrowLeft') {
                    document.getElementById('prev-zone').click();
                }
            });

            updateSlide();
        })();
    </script>
    
    {% if page.custom_js %}
    <script src="{{ '/assets/js/' | append: page.custom_js | relative_url }}"></script>
    {% endif %}

    <!-- Anime.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>

    <!-- Initialize Lucide Icons -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            lucide.createIcons();
        });
    </script>

    <!-- Custom Animations -->
    <script src="{{ '/assets/js/animations.js' | relative_url }}"></script>

    <!-- Language Switcher -->
    <script src="{{ '/assets/js/lang.js' | relative_url }}"></script>
</body>

</html>
